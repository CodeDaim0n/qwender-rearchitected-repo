<path d="M879 440 L879 464" fill="none" stroke="#708692" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="464" width="478" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="82" y="495" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Compiled credit policy</text>
<text x="82" y="524" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Priority rules inside the checkpoint</text>
<rect x="623" y="464" width="512" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
