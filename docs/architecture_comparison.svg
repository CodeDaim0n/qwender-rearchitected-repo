<path d="M879 334 L879 358" fill="none" stroke="#708692" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="358" width="478" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="82" y="389" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Compiled score + attribution</text>
<text x="82" y="418" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Fixed-point trees and exact TreeSHAP</text>
<rect x="623" y="358" width="512" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="641" y="389" fill="#007F78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Independent score + attribution</text>
<text x="641" y="418" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Same tensors; standalone artifact</text>
