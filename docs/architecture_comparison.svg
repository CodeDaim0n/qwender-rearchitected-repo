<path d="M879 652 L879 676" fill="none" stroke="#708692" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="676" width="478" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="82" y="707" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Qwen writer + verifier</text>
<text x="82" y="736" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Attach or withhold one paragraph</text>
