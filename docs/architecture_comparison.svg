<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
<title id="title">Bundled and separated credit architectures</title><desc id="desc">A bounded assessment packaged in one checkpoint compared with independent score, policy and writer artifacts plus explicit context and execution controls.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#708692"/></marker></defs>
<rect width="1200" height="1000" rx="24" fill="#FFFFFF"/>
<text x="44" y="55" fill="#007F78" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="2">ONE ASSESSMENT. TWO RELEASE MODELS.</text>
<text x="44" y="102" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="start">Preserve exactness. Separate responsibility.</text>
<rect x="38" y="145" width="530" height="670" rx="18" fill="#F4F7F9" stroke="#CFDCE3"/>
<rect x="596" y="145" width="566" height="670" rx="18" fill="#EEF7F4" stroke="#BFDAD2"/>
<text x="66" y="187" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">A  ORIGINAL BUNDLED DESIGN</text>
<text x="626" y="187" fill="#007F78" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">B  INDEPENDENT COMPONENTS</text>
<text x="66" y="223" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">One checkpoint identity</text>
<text x="626" y="223" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start">A manifest links separate artifact identities</text>
<rect x="64" y="252" width="478" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="82" y="283" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Validate the request</text>
<text x="82" y="312" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Typed credit application</text>
<rect x="623" y="252" width="512" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="641" y="283" fill="#007F78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Qualify context + validate</text>
<text x="641" y="312" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Approved policy, source, tenant, freshness</text>
