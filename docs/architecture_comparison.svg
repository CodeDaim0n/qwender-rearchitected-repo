<path d="M879 546 L879 570" fill="none" stroke="#708692" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="64" y="570" width="478" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="82" y="601" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Recourse + evidence</text>
<text x="82" y="630" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Deterministic assessment and receipt</text>
<rect x="623" y="570" width="512" height="82" rx="10" fill="#FFFFFF" stroke="#CFDCE3"/>
<text x="641" y="601" fill="#007F78" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start">Recourse + evidence</text>
<text x="641" y="630" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Same response contract and search</text>
