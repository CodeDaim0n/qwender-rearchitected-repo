<text x="87" y="882" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">ASSESSMENT JSON + RECEIPT</text>
<text x="87" y="914" fill="#BBD2DA" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Bounded, reproducible credit assessment</text>
<rect x="623" y="845" width="512" height="95" rx="12" fill="#FFF0E8" stroke="#E6C7B6"/>
<text x="647" y="882" fill="#B95138" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="start">SEPARATE EXECUTION GATE</text>
<text x="647" y="914" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Permission + recheck + ledger + lineage</text>
<path d="M303 758 L303 845" fill="none" stroke="#708692" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M879 758 L879 845" fill="none" stroke="#708692" stroke-width="2" marker-end="url(#arrow)"/>
<text x="44" y="980" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start">Same tested credit responses; added workflow controls. The original assessment API has no recording workflow.</text>
