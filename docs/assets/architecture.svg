<text x="52" y="111" fill="#152B3C" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" text-anchor="start">Every decision has evidence. Every action has a gate.</text>
<text x="52" y="152" fill="#526777" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start">Real component boundaries; synthetic authority and source assertions in this research prototype.</text>
