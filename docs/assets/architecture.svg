<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1230" viewBox="0 0 1600 1230" role="img" aria-labelledby="title desc">
<title id="title">The implemented credit architecture</title><desc id="desc">A trusted-context boundary precedes exact scoring and external OPA policy. Structured evidence feeds an optional Qwen writer and its verifier, then a separate gate authorizes a sandbox record and linked lineage.</desc>
